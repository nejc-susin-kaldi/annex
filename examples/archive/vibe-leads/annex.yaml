# Annex manifest. Full contract: `annex contract`
name: vibe-leads
owner: sam
description: Capture a new client lead and hand it to a teammate (Slack or email) to follow up with a quote
type: web
port: 8080
healthcheck: /healthz
access: internal
storage:
  postgres: true            # the team list (who leads can be assigned to)
  files: false
data:
  views: []
env:
  # Email notifications are switched on once SMTP_HOST and SMTP_FROM are set.
  SMTP_HOST: ""
  SMTP_PORT: "587"          # 465 = implicit TLS, anything else = STARTTLS
  SMTP_USERNAME: ""
  SMTP_FROM: ""
# No secrets declared = test mode: Slack and email are greyed out and the form only previews the
# message. To go live, declare them, set them (`annex secret set vibe-leads KEY=VALUE`) and redeploy:
#   secrets: [SLACK_WEBHOOK_URL, SMTP_PASSWORD]
secrets: []
egress: [hooks.slack.com]
