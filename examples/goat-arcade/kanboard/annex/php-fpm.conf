; php-fpm for Kanboard on Annex: runs as the container's user (uid 10001), writes only to /tmp, logs to stderr.
[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
log_level = warning
daemonize = no

[www]
listen = /tmp/php-fpm.sock
; Kanboard reads its settings from the environment (config.php): pass the container's environment through
clear_env = no
; Kanboard's own log lines (LOG_DRIVER stderr) reach the container log as they are, without fpm's prefix
catch_workers_output = yes
decorate_workers_output = no
; Sized for the 256 MB limit: a worker uses 15-30 MB, PHP's own cap per request is 96 MB
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 1000
php_admin_value[memory_limit] = 96M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
php_admin_value[expose_php] = Off
; PHP errors go to the log, never into a page
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
