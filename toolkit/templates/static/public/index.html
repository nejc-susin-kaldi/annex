<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; } td, th { padding: .3rem .6rem; border-bottom: 1px solid #e4e7eb; text-align: left; }
  </style>
</head>
<body>
  <h1 id="hello">Hello</h1>
  <p>This is the start of __APP_NAME__.</p>
  <script src="annex-errors.js"></script>
  <script>
    // Identity and data come from this app's own server (same origin), never from the browser directly.
    fetch("api/me").then(r => r.json()).then(me => {
      document.getElementById("hello").textContent = `Hello, ${me.name}`;
    });
    // A data view, once it is listed under data.views in annex.yaml (`annex contract` names this instance's views):
    //   fetch("api/data/<view>?order=day.desc&limit=10").then(r => r.json()).then(rows => { ... });
  </script>
</body>
</html>
