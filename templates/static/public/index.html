<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__APP_NAME__</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; color: #1f2933; }
    td.n { text-align: right; font-variant-numeric: tabular-nums; }
    table { border-collapse: collapse; } td, th { padding: .3rem .6rem; border-bottom: 1px solid #e4e7eb; text-align: left; }
  </style>
</head>
<body>
  <h1 id="hello">Hello</h1>
  <h2>Busiest machines (30 days)</h2>
  <table id="machines"><tr><th>#</th><th>Machine</th><th>Venue</th><th>Games</th></tr></table>
  <script src="annex-errors.js"></script>
  <script>
    // Identity and data come from this app's own server (same origin), never from the browser directly.
    fetch("api/me").then(r => r.json()).then(me => {
      document.getElementById("hello").textContent = `Hello, ${me.name}`;
    });
    fetch("api/data/machine_floor?order=games_30d.desc&limit=10").then(r => r.json()).then(rows => {
      const t = document.getElementById("machines");
      rows.forEach((r, i) => {
        const tr = t.insertRow();
        tr.insertCell().textContent = i + 1;
        tr.insertCell().textContent = r.title;
        tr.insertCell().textContent = r.venue_name;
        const c = tr.insertCell(); c.className = "n"; c.textContent = r.games_30d.toLocaleString();
      });
    });
  </script>
</body>
</html>
