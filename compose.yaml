# Annex platform. Runs on the VM from /srv/annex/platform (synced by scripts/push.sh).
# Settings come from the generated .env next to this file; secrets from
# ${ANNEX_DATA_DIR}/secrets. Metabase and Dozzle are in the "extras" profile.
name: annex

x-base: &base
  restart: unless-stopped
  labels:
    com.kaldi.annex: "true"
  security_opt:
    - no-new-privileges:true

x-tz: &tz
  TZ: ${TZ}

services:
  # --- Docker API access, one proxy per permission level -----------------
  socket-ro:
    <<: *base
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      INFO: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-ro]
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 3s

  socket-exec:
    <<: *base
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      INFO: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket-exec]
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 3s

  # --- Front door ---------------------------------------------------------
  traefik:
    <<: *base
    image: traefik:v3.7.14
    command: ["traefik", "--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "80:80"
    environment:
      <<: *tz
      ANNEX_CONFIG_HASH: ${ANNEX_CONFIG_HASH_TRAEFIK}
    volumes:
      - ./config/traefik:/etc/traefik:ro
    networks:
      # annex-ops (on edge) checks the front door by its real hostnames, which resolve to Traefik here
      edge: {aliases: ["${ANNEX_HOST_HOME}", "${ANNEX_HOST_AUTH}"]}
      platform: {}
      socket-ro: {}
    depends_on:
      socket-ro: {condition: service_healthy}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--configFile=/etc/traefik/traefik.yml"]
      interval: 15s
      timeout: 3s

  authelia:
    <<: *base
    image: authelia/authelia:4.39.28
    environment:
      <<: *tz
      X_AUTHELIA_CONFIG: /etc/annex/configuration.yml
      # make Go hand argon2 memory back before the container limit is reached
      GOMEMLIMIT: 160MiB
      ANNEX_CONFIG_HASH: ${ANNEX_CONFIG_HASH_AUTHELIA}
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/reset_password_jwt_secret
    volumes:
      - ./config/authelia:/etc/annex:ro
      # read-write: password resets and changes rewrite users.yml (in place, so it stays the annex user's 600 file)
      - ${ANNEX_DATA_DIR}/secrets/authelia:/secrets
      - ${ANNEX_DATA_DIR}/state/authelia:/data
    networks: [platform]
    # argon2 verification needs ~64 MB per concurrent login
    mem_limit: 256m
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.auth.rule: Host(`${ANNEX_HOST_AUTH}`)
      traefik.http.services.auth.loadbalancer.server.port: "9091"

  homepage:
    <<: *base
    image: gethomepage/homepage:v2.5.0
    environment:
      <<: *tz
      HOMEPAGE_ALLOWED_HOSTS: ${ANNEX_HOST_HOME}${ANNEX_PORT_SUFFIX}
      LOG_TARGETS: stdout
      ANNEX_CONFIG_HASH: ${ANNEX_CONFIG_HASH_HOMEPAGE}
    volumes:
      - ./config/homepage:/app/config:ro
    # socket-ro stays (D80): deployed apps' tiles come from their Docker labels, which only the Docker provider reads
    networks: [platform, socket-ro]
    mem_limit: 256m
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.home.rule: Host(`${ANNEX_HOST_HOME}`)
      traefik.http.services.home.loadbalancer.server.port: "3000"

  # --- Data ---------------------------------------------------------------
  product-db:
    <<: *base
    image: postgres:16.15-alpine3.24
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - "log_line_prefix=%m [%p] %u@%d "
    env_file: ${ANNEX_DATA_DIR}/secrets/product-db.env
    environment:
      <<: *tz
      POSTGRES_DB: product
    volumes:
      - ${ANNEX_DATA_DIR}/state/product-db:/var/lib/postgresql/data
      - ./db/product:/docker-entrypoint-initdb.d:ro
    networks: [product, clientlink]
    shm_size: 128m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product"]
      interval: 10s
      timeout: 3s
      start_period: 60s

  gateway:
    <<: *base
    image: postgrest/postgrest:v16.4
    env_file: ${ANNEX_DATA_DIR}/secrets/gateway.env
    environment:
      PGRST_DB_SCHEMAS: annex_api
      PGRST_DB_PRE_REQUEST: annex_gateway.log_request
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: info
      PGRST_OPENAPI_MODE: follow-privileges
    networks: [edge, product]
    depends_on:
      product-db: {condition: service_healthy}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 15s
      timeout: 3s
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: Host(`${ANNEX_HOST_GATEWAY}`)
      traefik.http.services.gateway.loadbalancer.server.port: "3000"

  appdata-db:
    <<: *base
    image: postgres:16.15-alpine3.24
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
    env_file: ${ANNEX_DATA_DIR}/secrets/appdata-db.env
    environment:
      <<: *tz
    volumes:
      - ${ANNEX_DATA_DIR}/state/appdata-db:/var/lib/postgresql/data
      - ./db/appdata/init:/docker-entrypoint-initdb.d:ro
      - ./db/appdata/hooks:/annex:ro
      - ${ANNEX_DATA_DIR}/dumps:/dumps
    # appdata: apps with Postgres, ops and the receiver; console: the console's read-only role (D69), nobody else
    networks: [appdata, console]
    shm_size: 128m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      start_period: 60s
    labels:
      com.kaldi.annex: "true"
      # nightly backup: dump every database before the archive is taken
      docker-volume-backup.archive-pre: /bin/sh /annex/dump-all.sh
      docker-volume-backup.exec-label: annex

  # --- Outbound: email and Slack for apps (annex-ops) ---------------------
  # Apps call http://ops:8000 with a per-app token; ops holds the SMTP and Slack side so apps never do.
  # No Traefik route: ops is reached only from the edge network.
  ops:
    <<: *base
    image: annex-ops:local
    build:
      context: ./ops
      labels:
        com.kaldi.annex: "true"
    env_file:
      - ${ANNEX_DATA_DIR}/secrets/ops.env
      # SLACK_BOT_TOKEN; the file only exists once a human has connected Slack (docs/setup.md)
      - path: ${ANNEX_DATA_DIR}/secrets/slack.env
        required: false
    environment:
      <<: *tz
      ANNEX_EMAIL_DOMAINS: ${ANNEX_EMAIL_DOMAINS}
      ANNEX_EMAIL_ALLOW: ${ANNEX_EMAIL_ALLOW}
      ANNEX_EMAIL_FROM: ${ANNEX_EMAIL_FROM}
      OPS_SMTP_HOST: mailpit
      OPS_SMTP_PORT: "1025"
      OPS_USERS_FILE: /annex/directory/users.json
      # alerts (M1.3): where to post, and what to put in links
      ANNEX_ALERT_SLACK_CHANNEL: ${ANNEX_ALERT_SLACK_CHANNEL}
      ANNEX_URL_STATUS: ${ANNEX_URL_CONSOLE}/status
      ANNEX_FRONTDOOR_URL: ${ANNEX_FRONTDOOR_URL}
      ANNEX_URL_METABASE: ${ANNEX_URL_METABASE}
      # incoming webhooks (M1.5): the public URL (receiving is the hooks container's job; ops delivers)
      ANNEX_URL_HOOKS: ${ANNEX_URL_HOOKS}
      ANNEX_HOST_PATTERN: ${ANNEX_HOST_PATTERN}
      ANNEX_PORT_SUFFIX: ${ANNEX_PORT_SUFFIX}
    volumes:
      # the directory, not the file: replacing the file would leave a stale single-file bind mount (D7)
      - ${ANNEX_DATA_DIR}/state/directory:/annex/directory:ro
      # runtime tuning of the alert thresholds (tuning.json, only present during tests)
      - ${ANNEX_DATA_DIR}/state/ops:/annex/state:ro
      # each app's hooks file (delivery needs its token, port and paths; the directory, not a file: D7)
      - ${ANNEX_DATA_DIR}/secrets/hooks:/annex/hooks:ro
    # edge: apps reach it, and it reaches Slack; platform: Mailpit's SMTP and Homepage's tiles; appdata: its database;
    # socket-ro: Docker events and logs, read-only
    networks: [edge, platform, appdata, socket-ro]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    depends_on:
      appdata-db: {condition: service_healthy}
      socket-ro: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      start_interval: 2s

  # The webhook receiver (M1.5, D55): the only route without a login, in its own container. Same image as ops,
  # different command; it gets only the hooks files and a database role that may only insert events: no SMTP,
  # Slack token, user directory or Docker access, no background threads. Delivery and retries stay in ops.
  hooks:
    <<: *base
    image: annex-ops:local
    pull_policy: never  # built by the ops service
    command: ["uvicorn", "annex_ops.hooks_app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${ANNEX_DATA_DIR}/secrets/hooks-receiver.env
    environment:
      <<: *tz
      OPS_WATCHERS: "0"
      ANNEX_HOST_HOOKS: ${ANNEX_HOST_HOOKS}
      ANNEX_URL_HOOKS: ${ANNEX_URL_HOOKS}
    volumes:
      - ${ANNEX_DATA_DIR}/secrets/hooks:/annex/hooks:ro
    # edge: Traefik routes to it; appdata: its database. Not on platform or socket-ro.
    networks: [edge, appdata]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 96m
    depends_on:
      appdata-db: {condition: service_healthy}
      ops: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      start_interval: 2s
    labels:
      com.kaldi.annex: "true"
      # Traefik sends only /h/ here (with a rate limit and a 1 MB body cap), and the receiver refuses everything
      # else, so a routing mistake can't expose anything (D51).
      traefik.enable: "true"
      traefik.docker.network: annex-edge
      traefik.http.routers.hooks.rule: Host(`${ANNEX_HOST_HOOKS}`) && PathPrefix(`/h/`)
      traefik.http.routers.hooks.middlewares: hooks-ratelimit,hooks-limit
      traefik.http.middlewares.hooks-ratelimit.ratelimit.average: "20"
      traefik.http.middlewares.hooks-ratelimit.ratelimit.burst: "40"
      traefik.http.middlewares.hooks-limit.buffering.maxRequestBodyBytes: "1048576"
      traefik.http.services.hooks.loadbalancer.server.port: "8000"

  # The console (M2.4, D69): server-rendered pages for builders and admins, read-only. Its own container (the ops image,
  # another command) so that the identity headers it trusts can only come from Traefik's forward-auth: it is on `platform`
  # (Traefik) and on `console`, a network shared only with appdata-db. Never on `edge` or `appdata`, where apps
  # are, so no app can reach it and forge a Remote-User. Its database role may only SELECT what its pages show. No
  # Docker access, no SMTP, no Slack token, no directory, no secrets of any app.
  console:
    <<: *base
    image: annex-ops:local
    pull_policy: never  # built by the ops service
    command: ["uvicorn", "annex_ops.console_app:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${ANNEX_DATA_DIR}/secrets/console.env
    environment:
      <<: *tz
      OPS_WATCHERS: "0"
      ANNEX_HOST_PATTERN: ${ANNEX_HOST_PATTERN}
      ANNEX_PORT_SUFFIX: ${ANNEX_PORT_SUFFIX}
      ANNEX_URL_HOME: ${ANNEX_URL_HOME}
    networks: [platform, console]
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 96m
    depends_on:
      appdata-db: {condition: service_healthy}
      ops: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      start_interval: 2s
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.console.rule: Host(`${ANNEX_HOST_CONSOLE}`)
      traefik.http.services.console.loadbalancer.server.port: "8000"

  # Prototype mail server: catches everything, nothing leaves the VM. Admins only (Authelia rule).
  mailpit:
    <<: *base
    image: axllent/mailpit:v1.31.6
    environment:
      <<: *tz
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
    volumes:
      - ${ANNEX_DATA_DIR}/state/mailpit:/data
    networks: [platform]
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 3s
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.mail.rule: Host(`${ANNEX_HOST_MAIL}`)
      traefik.http.services.mail.loadbalancer.server.port: "8025"

  # --- Jobs and backups ---------------------------------------------------
  ofelia:
    <<: *base
    image: mcuadros/ofelia:0.3.22
    command: ["daemon", "--docker", "-f", "label=com.kaldi.annex=true"]
    environment:
      <<: *tz
      DOCKER_HOST: tcp://socket-exec:2375
    networks: [socket-exec]
    depends_on:
      socket-exec: {condition: service_healthy}
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "pgrep", "ofelia"]
      interval: 30s
      timeout: 3s
    labels:
      com.kaldi.annex: "true"
      ofelia.enabled: "true"
      # keeps the scheduler non-empty before any app registers a job
      ofelia.job-local.heartbeat.schedule: "@every 1h"
      ofelia.job-local.heartbeat.command: "true"

  backup:
    <<: *base
    image: offen/docker-volume-backup:v2.49.1
    environment:
      <<: *tz
      DOCKER_HOST: tcp://socket-exec:2375
      BACKUP_CRON_EXPRESSION: "0 2 * * *"
      BACKUP_FILENAME: annex-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: annex-
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_ARCHIVE: /archive
      EXEC_LABEL: annex
    volumes:
      - ${ANNEX_DATA_DIR}/apps:/backup/apps:ro
      - ${ANNEX_DATA_DIR}/dumps:/backup/dumps:ro
      - ${ANNEX_DATA_DIR}/backups:/archive
    networks: [socket-exec]
    depends_on:
      socket-exec: {condition: service_healthy}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "pgrep", "backup"]
      interval: 30s
      timeout: 3s

  # --- Extras (profile off by default) ------------------------------------
  metabase:
    <<: *base
    image: metabase/metabase:v0.64.2.2
    profiles: [extras]
    env_file: ${ANNEX_DATA_DIR}/secrets/metabase.env
    environment:
      <<: *tz
      JAVA_OPTS: -Xmx1g
      MB_DB_TYPE: postgres
      MB_DB_HOST: appdata-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_SITE_URL: ${ANNEX_URL_METABASE}
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
    networks: [platform, product, appdata]
    depends_on:
      appdata-db: {condition: service_healthy}
      product-db: {condition: service_healthy}
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      start_period: 240s
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.metabase.rule: Host(`${ANNEX_HOST_METABASE}`)
      traefik.http.services.metabase.loadbalancer.server.port: "3000"

  dozzle:
    <<: *base
    image: amir20/dozzle:v11.3.2
    profiles: [extras]
    environment:
      <<: *tz
      DOCKER_HOST: tcp://socket-ro:2375
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_FILTER: label=com.kaldi.annex=true
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
    networks: [platform, socket-ro]
    depends_on:
      socket-ro: {condition: service_healthy}
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 3s
    labels:
      com.kaldi.annex: "true"
      traefik.enable: "true"
      traefik.docker.network: annex-platform
      traefik.http.routers.logs.rule: Host(`${ANNEX_HOST_LOGS}`)
      traefik.http.services.logs.loadbalancer.server.port: "8080"

networks:
  # traefik, apps and the gateway; the only network with outbound access
  edge:
    name: annex-edge
    labels: {com.kaldi.annex: "true"}
  # traefik and platform UIs; apps are never on it
  platform:
    name: annex-platform
    internal: true
    labels: {com.kaldi.annex: "true"}
  # product-db, gateway, metabase; apps are never on it
  product:
    name: annex-product
    internal: true
    labels: {com.kaldi.annex: "true"}
  # product-db and a client's own database (democlient/, D77): product-db reads it through postgres_fdw
  clientlink:
    name: annex-clientlink
    internal: true
    labels: {com.kaldi.annex: "true"}
  # appdata-db, apps, metabase
  appdata:
    name: annex-appdata
    internal: true
    labels: {com.kaldi.annex: "true"}
  # the console and appdata-db, nobody else (the console's read-only database role)
  console:
    name: annex-console
    internal: true
    labels: {com.kaldi.annex: "true"}
  socket-ro:
    name: annex-socket-ro
    internal: true
    labels: {com.kaldi.annex: "true"}
  socket-exec:
    name: annex-socket-exec
    internal: true
    labels: {com.kaldi.annex: "true"}
