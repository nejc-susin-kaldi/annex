[project]
name = "annex-cli"
version = "0.1.0"
description = "Deploy small internal tools to a Kaldi Annex server"
requires-python = ">=3.12"
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
annex = "annex_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annex_cli"]
